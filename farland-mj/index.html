<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#14110f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Farland MJ — Compagnon de jeu de rôle</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <span class="logo">🐉</span>
    <h1>Farland <span class="muted" style="font-weight:400;font-size:14px">— MJ</span></h1>
    <button class="sub" id="force-update" title="Forcer la mise à jour">v1.2 ⟳</button>
  </header>

  <main>
    <!-- ACCUEIL / SCÉNARIOS -->
    <section id="view-jeu" class="view active"></section>
    <!-- DÉS -->
    <section id="view-des" class="view"></section>
    <!-- PERSONNAGES -->
    <section id="view-perso" class="view"></section>
    <!-- BESTIAIRE -->
    <section id="view-bestiaire" class="view"></section>
    <!-- UNIVERS -->
    <section id="view-univers" class="view"></section>
  </main>

  <div class="floating-hint" id="hint"></div>

  <nav class="tabbar">
    <button data-tab="jeu" class="active"><span class="ic">📖</span>Aventure</button>
    <button data-tab="des"><span class="ic">🎲</span>Dés</button>
    <button data-tab="perso"><span class="ic">🛡️</span>Persos</button>
    <button data-tab="bestiaire"><span class="ic">👹</span>Bestiaire</button>
    <button data-tab="univers"><span class="ic">🌍</span>Univers</button>
  </nav>

  <!-- Données -->
  <script src="js/data/lore.js"></script>
  <script src="js/data/bestiary.js"></script>
  <script src="js/data/scenarios.js"></script>
  <script src="js/data/characters.js"></script>
  <!-- Logique -->
  <script src="js/dice.js"></script>
  <script src="js/combat.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Enregistrement du service worker + auto-mise à jour quand une nouvelle version est dispo
    if ('serviceWorker' in navigator) {
      let refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (refreshing) return; refreshing = true; location.reload();
      });
      window.addEventListener('load', async () => {
        try {
          const reg = await navigator.serviceWorker.register('sw.js');
          reg.update();
          setInterval(() => reg.update(), 60000);
        } catch (e) {}
      });
    }
    // Bouton « ⟳ » : vide les caches + le service worker et recharge (garde la progression)
    async function forceUpdate() {
      try {
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map((r) => r.unregister()));
        }
        if (window.caches) {
          const keys = await caches.keys();
          await Promise.all(keys.map((k) => caches.delete(k)));
        }
      } catch (e) {}
      location.reload();
    }
    document.getElementById('force-update').addEventListener('click', forceUpdate);
  </script>
</body>
</html>
